server {
    listen 80;
    server_name manager.slidestutor.com www.manager.slidestutor.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name manager.slidestutor.com www.manager.slidestutor.com;


    ssl_certificate /etc/nginx/ssl/manager.slidestutor.com.pem;
    ssl_certificate_key /etc/nginx/ssl/manager.slidestutor.com.key;

    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES256-SHA:HIGH:!MEDIUM:!LOW:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4:@STRENGTH';
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    client_max_body_size 50M;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 处理 /index.html 文件的缓存策略
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 根路径规则，包含静态资源嵌套配置
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存规则（仅作用于根路径）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }


    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
